# E12 (ACS, Fase 2) - configuracion de SonarCloud.
# projectKey y organization deben coincidir EXACTAMENTE con los que SonarCloud muestre al
# importar el repositorio (ver docs/SONARCLOUD_SETUP.md); si son otros, corregirlos aqui.
sonar.projectKey=mvarelam1-hub_Laboratorio-Clinico-Vaclinic
sonar.organization=mvarelam1-hub
sonar.projectName=VACLINIC

sonar.sources=server,src
sonar.tests=server,src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,db/**
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
