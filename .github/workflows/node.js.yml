# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Hallazgo real (ver sección 5 del entregable): Node 18.x llegó a su
        # fin de soporte (EOL) en abril de 2025 y falla en este proyecto con
        # un bug conocido de npm en dependencias opcionales nativas
        # (@tailwindcss/oxide, ver https://github.com/npm/cli/issues/4828),
        # no relacionado con el código de VACLINIC. Se retira del matrix y se
        # mantienen las versiones de Node soportadas.
        node-version: [20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test
